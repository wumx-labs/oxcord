[package]
name = "e24_stateless_worker"
version = "0.1.0"
authors = ["NoxlyDev"]
edition = "2024"
publish = false

[dependencies]
oxcord = { path = "../../crates/oxcord", features = ["broker", "cache"] }
oxcord-broker = { path = "../../crates/oxcord-broker" }
oxcord-cache = { path = "../../crates/oxcord-cache" }
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
