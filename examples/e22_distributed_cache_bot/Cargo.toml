[package]
name = "e22_distributed_cache_bot"
version = "0.1.0"
authors = ["NoxlyDev"]
edition = "2024"
publish = false

[dependencies]
oxcord = { path = "../../crates/oxcord", features = ["cache"] }
oxcord-cache = { path = "../../crates/oxcord-cache" }
tokio = { version = "1.34", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
