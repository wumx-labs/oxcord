[package]
name = "e16_sqlite_database"
version = "0.1.0"
authors = ["NoxlyDev"]
edition = "2018"

[dependencies]
oxcord = { path = "../../crates/oxcord", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
