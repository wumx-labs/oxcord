[package]
name = "oxcord-proxy"
version = "0.1.0"
authors = ["NoxlyDev", "Oxcord Contributors"]
description = "Centralized Discord REST API Rate Limiting Proxy"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
oxcord-rest = { path = "../oxcord-rest", features = ["rustls_backend"] }
tiny_http = "0.12"
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[lints.cargo]
unused_dependencies = "allow"
