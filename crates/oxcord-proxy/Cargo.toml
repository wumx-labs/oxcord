[package]
name = "oxcord-proxy"
version = "0.1.0"
authors = ["NoxlyDev"]
description = "Centralized Discord REST API Rate Limiting Proxy"

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord-rest = { version = "0.0.1", path = "../oxcord-rest", features = ["rustls_backend"] }
tiny_http = "0.12"
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[lints.cargo]
unused_dependencies = "allow"
