[package]
name = "oxcord-proxy"
version = "0.1.1"
authors = ["NoxlyDev"]
description = "Centralized Discord REST API Rate Limiting Proxy"

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord-rest = { version = "0.1.0", path = "../oxcord-rest", features = ["rustls_backend"] }

# HTTP server — hyper 1.0 (fully async, no blocking threads)
hyper = { version = "1.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
http-body-util = "0.1"
bytes = "1.5"

# HTTP client for upstream Discord forwarding
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
thiserror = "1.0"

[lints.cargo]
unused_dependencies = "allow"
