[package]
name = "oxcord-voice"
version = "0.1.0"
authors = ["NoxlyDev"]
description = "Voice Gateway client, RTP audio pipeline, and voice driver for the OXCORD library."
readme = "../../README.md"
include = ["src/**/*", "Cargo.toml"]

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord-model = { version = "0.1.0", path = "../oxcord-model" }
oxcord-voice-model = { version = "0.2.1", path = "../oxcord-voice-model" }
tokio = { version = "1.34.0", features = ["sync", "time", "net", "macros", "rt"] }
tokio-tungstenite = { version = "0.21.0" }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
futures-util = { version = "0.3.32", default-features = false, features = ["sink"] }
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
tracing = { version = "0.1.40", features = ["log"] }
ring = "0.17"
url = "2.4.1"
async-trait = "0.1.86"

[features]
default = ["rustls_backend"]
rustls_backend = ["tokio-tungstenite/rustls-tls-webpki-roots"]
native_tls_backend = ["tokio-tungstenite/native-tls"]

[lints.cargo]
unused_dependencies = "allow"

[lints.rust]
unexpected_cfgs = { level = "allow" }
