[package]
name = "oxcord-gateway-daemon"
version = "0.1.0"
authors = ["NoxlyDev", "Oxcord Contributors"]
description = "Standalone Discord Gateway Daemon for enterprise-scale distributed sharding"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
oxcord = { path = "../oxcord", features = ["gateway", "broker"] }
oxcord-broker = { path = "../oxcord-broker" }
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
