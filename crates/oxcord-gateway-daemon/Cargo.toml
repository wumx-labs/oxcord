[package]
name = "oxcord-gateway-daemon"
version = "0.1.1"
authors = ["NoxlyDev"]
description = "Standalone Discord Gateway Daemon for enterprise-scale distributed sharding"

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord = { version = "0.1.0", path = "../oxcord", features = ["gateway", "broker"] }
oxcord-broker = { version = "0.1.0", path = "../oxcord-broker" }
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
