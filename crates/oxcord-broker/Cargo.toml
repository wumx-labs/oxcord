[package]
name = "oxcord-broker"
version = "0.1.0"
authors = ["NoxlyDev", "Oxcord Contributors"]
description = "Message broker abstraction and drivers (In-Process, Redis, NATS) for large-scale distributed Discord bots"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wumx-labs/oxcord.git"

[features]
default = []
redis = ["dep:redis"]
nats = ["dep:async-nats"]
kafka = ["dep:rskafka"]

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
futures-core = "0.3"
tokio = { version = "1.34", default-features = false, features = ["sync", "rt", "macros", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
tracing = "0.1"

# Optional broker drivers
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"], optional = true }
async-nats = { version = "0.38", optional = true }
rskafka = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.34", features = ["full"] }

[lints.cargo]
unused_dependencies = "allow"
