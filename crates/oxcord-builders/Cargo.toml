[package]
name = "oxcord-builders"
version = "0.1.0"
authors = ["NoxlyDev"]
description = "Type-safe builder patterns for Discord API objects in the Oxcord library."
readme = "../../README.md"
include = ["src/**/*", "Cargo.toml"]

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord-model = { version = "0.1.0", path = "../oxcord-model" }
oxcord-rest = { version = "0.1.0", path = "../oxcord-rest" }
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
async-trait = "0.1.74"
url = { version = "2.4.1", features = ["serde"] }
arrayvec = { version = "0.7.4", features = ["serde"] }
base64 = "0.22.0"
tracing = { version = "0.1.40", features = ["log"] }
simd-json = { version = "0.13.4", optional = true }

[features]
default = ["chrono"]
chrono = ["oxcord-model/chrono"]
simd_json = ["simd-json", "oxcord-model/simd_json", "oxcord-rest/simd_json"]
unstable_discord_api = []

[lints.cargo]
unused_dependencies = "allow"

[lints.rust]
unexpected_cfgs = { level = "allow" }
