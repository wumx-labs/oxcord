[package]
name = "oxcord-rest"
version = "0.1.0"
authors = ["NoxlyDev"]
description = "Discord REST API client and rate limiter for the Oxcord library."
readme = "../../README.md"
include = ["src/**/*", "Cargo.toml"]

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord-model = { version = "0.1.0", path = "../oxcord-model" }
oxcord-cache = { version = "0.1.0", path = "../oxcord-cache", optional = true }
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
reqwest = { version = "0.11", default-features = false, features = ["multipart", "stream"] }
tokio = { version = "1.34.0", features = ["sync", "time", "macros", "rt"] }
tracing = { version = "0.1.40", features = ["log"] }
percent-encoding = "2.3.0"
url = { version = "2.4.1", features = ["serde"] }
secrecy = { version = "0.8.0", features = ["serde"] }
mime_guess = "2.0.4"
bytes = "1.5.0"
base64 = "0.22.0"
arrayvec = { version = "0.7.4", features = ["serde"] }
simd-json = { version = "0.13.4", optional = true }

[features]
default = ["rustls_backend", "utils"]
cache = ["dep:oxcord-cache"]
utils = []
rustls_backend = ["reqwest/rustls-tls"]
native_tls_backend = ["reqwest/native-tls"]
simd_json = ["simd-json", "oxcord-model/simd_json"]

[dev-dependencies.http_crate]
version = "0.2"
package = "http"

[lints.cargo]
unused_dependencies = "allow"

[lints.rust]
unexpected_cfgs = { level = "allow" }
