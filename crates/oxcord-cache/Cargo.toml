[package]
name = "oxcord-cache"
version = "0.0.1"
description = "In-memory Discord state cache for oxcord"
authors = ["NoxlyDev"]

documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxcord-model = { version = "0.0.1", path = "../oxcord-model" }
dashmap = { version = "5.5.3", features = ["serde"] }
parking_lot = "0.12.1"
rustc-hash = "2.1.1"
tracing = "0.1"
async-trait = "0.1.74"
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
mini-moka = { version = "0.10.2", optional = true }
typesize = { version = "0.1.2", optional = true, features = ["url", "time", "serde_json", "secrecy", "dashmap", "parking_lot", "details"] }

[dev-dependencies]
tokio = { version = "1.34.0", features = ["macros", "rt"] }

[features]
default = []
temp_cache = ["mini-moka", "typesize?/mini_moka"]

[lints.cargo]
unused_dependencies = "allow"

[lints.rust]
unexpected_cfgs = { level = "allow" }
