name: Docs — Build & Deploy

on:
  push:
    branches: [main, master, current]
    paths:
      - 'docs/**'
      - 'crates/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master, current]
    paths:
      - 'docs/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: '20'

jobs:
  # ── 1. Build VitePress portal (Vercel handles deployment) ─────────────────
  vitepress:
    name: Build VitePress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --prefer-offline

      - name: Build VitePress
        working-directory: docs
        run: npx vitepress build

  # ── 2. Build Rustdoc API reference ────────────────────────────────────────
  rustdoc:
    name: Build Rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: >-
            --cfg docsrs
            --html-in-header docs/.vitepress/rustdoc-header.html
        run: |
          cargo doc --workspace --no-deps --features full 2>/dev/null || \
          cargo doc --workspace --no-deps
