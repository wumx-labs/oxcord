name: Docs — Build & Deploy

on:
  push:
    branches: [main, master, current]
    paths:
      - 'docs/**'
      - 'crates/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master, current]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: '20'

jobs:
  # ── 1. Build VitePress portal ──────────────────────────────────────────────
  vitepress:
    name: Build VitePress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --prefer-offline

      - name: Build VitePress
        working-directory: docs
        run: npx vitepress build

      - name: Upload VitePress artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist/
          retention-days: 1

  # ── 2. Build Rustdoc API reference ────────────────────────────────────────
  rustdoc:
    name: Build Rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (nightly for doc_cfg)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: >-
            --cfg docsrs
            --html-in-header docs/.vitepress/rustdoc-header.html
        run: |
          cargo doc --workspace --no-deps --features full 2>/dev/null || \
          cargo doc --workspace --no-deps

      - name: Redirect index
        run: |
          echo '<meta http-equiv="refresh" content="0;url=oxcord/index.html">' \
            > target/doc/index.html

      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-dist
          path: target/doc/
          retention-days: 1

  # ── 3. Deploy to GitHub Pages (main only) ─────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [vitepress, rustdoc]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/current'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download VitePress artifact
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: ./pages

      - name: Download Rustdoc artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdoc-dist
          path: ./pages/api

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
